# System.Zlib.C: zlib's C API, written by `adam cimport` from the installed zlib.h / zconf.h
# (res/libs/vendor/include/zlib, AdamLang-Libs build-zlib.cmd); System.Zlib is the Adam API
# over it. Regenerate: adam cimport res\cimport\System.Zlib.C.cimport.toml
format = 1

[import]
header = "zlib.h"
unit = "System.Zlib.C"
library = "zlib"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
# z_const read as const (zlib's ZLIB_CONST); the definitions libzlib.a is built with
defines = ["ZLIB_CONST", "_LARGEFILE64_SOURCE=1", "HAVE_UNISTD_H=1", "HAVE_STDARG_H=1"]
includes = ["../libs/vendor/include/zlib"]

[skip]
# no value to bind: zconf.h's declaration words, its type macros (z_off_t is off_t, a system
# header's), zlib_version (a call of zlibVersion), the gzgetc macro over the routine gzgetc
macros = ["z_const", "OF", "ZEXTERN", "Z_U4", "z_off_t", "z_off64_t", "zlib_version", "gzgetc"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.Zlib.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
