  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.Zlib.C.adam - zlib's C API (Jean-loup Gailly and Mark Adler, zlib
  license), written by `adam cimport` from the zlib.h / zconf.h libzlib.a is
  built with (res/libs/vendor/include/zlib, tag v1.4) with the headers' own
  names: z_stream and the other records laid out as C lays them out, every
  routine `external "zlib"` (libzlib.a in res/libs/vendor/<triple>, built by
  AdamLang-Libs), the constants and the init macros (deflateInit ..
  inflateInit2 over deflateInit_ .., which take ZLIB_VERSION and the
  stream's size: zlib refuses a stream of another layout). System.Zlib is
  the Adam API over it. Do not edit: a change belongs in the spec,
  res/cimport/System.Zlib.C.cimport.toml, then regenerate.
*******************************************************************************/

'''
