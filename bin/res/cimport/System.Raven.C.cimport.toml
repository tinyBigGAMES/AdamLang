# System.Raven.C: Raven's C API (Raven.h), written by `adam cimport` from the installed Raven
# headers (res/libs/vendor/include/raven, AdamLang-Libs build-raven.cmd).
# Regenerate: adam cimport res\cimport\System.Raven.C.cimport.toml
format = 1

[import]
header = "Raven.h"
unit = "System.Raven.C"
library = "raven"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
includes = ["../libs/vendor/include/raven"]

# Raven's inline helpers call math.h / string.h: Adam's libc.a binds those for both targets
[uses]
"System.LibC.C" = ["math.h", "bits/mathcalls*.h", "string.h"]

# C forms with no Adam one (each read): Rerror_check, a do { } while (0) statement macro
# printing through stdio.h with __FILE__ / __LINE__ (System.Raven gives the Adam form)
[skip]
macros = ["Rerror_check"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.Raven.C.adam - written by adam cimport"
text = '''


/*******************************************************************************
  Adam™ Programming Language

  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.Raven.C.adam - Raven's C API (Oscar Soirey, Apache-2.0, v0.3.0:
  widgets, layout panels, themes, XML-described windows, text input, menus,
  dialogs, a Vulkan renderer opened at run time), written by `adam cimport`
  from the headers libraven.a is built with (res/libs/vendor/include/raven)
  with their own names: every routine `external "raven"` (libraven.a in
  res/libs/vendor/<triple>, built by AdamLang-Libs; its LICENSE, NOTICE and
  the bundled components' licenses in res/libs/vendor/licenses/raven),
  records laid out as C lays them out, the constant macros as typed
  consts. Raven's own link list (its CMakeLists.txt) is the unit's
  @linklibrary list, per target. Do not edit: a change belongs in the spec,
  res/cimport/System.Raven.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# Raven's own link list (its CMakeLists.txt's RAVEN_LIBRARIES), per target
[[insert]]
after = "module unit System.Raven.C;\n"
text = """

@ifdef TARGET_X86_64_WINDOWS_GNU
  @linklibrary "kernel32";
  @linklibrary "winhttp";
  @linklibrary "user32";
  @linklibrary "gdi32";
  @linklibrary "shell32";
  @linklibrary "comdlg32";
  @linklibrary "ole32";
@elseif TARGET_X86_64_LINUX_GNU
  @linklibrary "X11";
  @linklibrary "pthread";
  @linklibrary "m";
  @linklibrary "dl";
@endif
"""
