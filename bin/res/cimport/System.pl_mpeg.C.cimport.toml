# System.pl_mpeg.C: pl_mpeg's C API (pl_mpeg.h, with AdamLang-Libs' plm_utf8.h and
# plm_stream.h), written by `adam cimport` from the installed pl_mpeg headers
# (res/libs/vendor/include/pl_mpeg, AdamLang-Libs build-pl_mpeg.cmd).
# Regenerate: adam cimport res\cimport\System.pl_mpeg.C.cimport.toml
format = 1

[import]
# plm_utf8.h first: it includes stdio.h, then pl_mpeg.h (whose declarations use FILE with no
# include of their own, as AdamLang-Libs' pl_mpeg.c compiles it)
header = ["plm_utf8.h", "plm_stream.h"]
unit = "System.pl_mpeg.C"
library = "pl_mpeg"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
includes = ["../libs/vendor/include/pl_mpeg"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.pl_mpeg.C.adam - written by adam cimport"
text = '''

/*******************************************************************************
