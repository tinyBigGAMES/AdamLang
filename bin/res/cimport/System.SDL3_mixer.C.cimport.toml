# System.SDL3_mixer.C: SDL3_mixer's C API, written by `adam cimport` from the installed
# SDL_mixer.h (res/libs/vendor/include/sdl3_mixer, AdamLang-Libs build-sdl3_mixer.cmd); SDL3's
# declarations are System.SDL3.C's. Regenerate: adam cimport res\cimport\System.SDL3_mixer.C.cimport.toml
format = 1

[import]
header = "SDL3_mixer/SDL_mixer.h"
unit = "System.SDL3_mixer.C"
library = "sdl3_mixer"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
# as System.SDL3.C reads SDL's headers: SDL_oldnames.h kept out by its guard
defines = ["SDL_oldnames_h_"]
includes = ["../libs/vendor/include/sdl3_mixer", "../libs/vendor/include/sdl3"]

[uses]
"System.SDL3.C" = ["SDL3/*"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.SDL3_mixer.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
  Adam™ Programming Language

  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.SDL3_mixer.C.adam - SDL3_mixer's C API (Sam Lantinga, zlib license,
  release-3.2.4: mixers, tracks, groups, decoders for WAV, AIFF, VOC, AU,
  FLAC, MP3, Ogg Vorbis and MIDI), written by `adam cimport` from the
  header libsdl3_mixer.a is built with (res/libs/vendor/include/sdl3_mixer)
  with its own names: every routine `external "sdl3_mixer"`
  (libsdl3_mixer.a in res/libs/vendor/<triple>, built by AdamLang-Libs).
  SDL_mixer.h includes SDL.h, so SDL3's declarations are System.SDL3.C's
  (imported); the mixer plays through SDL3, so the unit links libsdl3.a
  with @linklibrary. Do not edit: a change belongs in the spec,
  res/cimport/System.SDL3_mixer.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# the mixer plays through SDL3
[[insert]]
after = "module unit System.SDL3_mixer.C;\n"
text = """

@linklibrary "sdl3";
"""
