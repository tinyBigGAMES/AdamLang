# System.MojoAL.C: mojoAL's OpenAL 1.1 API, written by `adam cimport` from the installed
# AL/al.h and AL/alc.h (res/libs/vendor/include/mojoal, AdamLang-Libs build-mojoal.cmd); they
# include nothing of SDL's, so the unit holds no SDL declaration: only its link needs libsdl3.a
# Regenerate: adam cimport res\cimport\System.MojoAL.C.cimport.toml
format = 1

[import]
header = ["AL/al.h", "AL/alc.h"]
unit = "System.MojoAL.C"
library = "mojoal"
output = "../libs/std"

[preprocess]
# libmojoal.a is static: plain symbols, never dllimport
defines = ["AL_LIBTYPE_STATIC"]
includes = ["../libs/vendor/include/mojoal"]

# ALvoid / ALCvoid alias void (no Adam alias: a const ALvoid * is written ptr to const); the
# *APIENTRY macros are calling-convention attributes
[skip]
types = ["ALvoid", "ALCvoid"]
macros = ["AL_APIENTRY", "ALAPIENTRY", "ALC_APIENTRY", "ALCAPIENTRY"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.MojoAL.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
  Adam™ Programming Language

  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.MojoAL.C.adam - OpenAL 1.1 (AL/al.h, AL/alc.h) through mojoAL
  (Ryan C. Gordon, zlib license; an OpenAL over SDL3's audio, commit
  eec0a9f462af), written by `adam cimport` from the headers libmojoal.a is
  built with (res/libs/vendor/include/mojoal) with their own names: every
  routine `external "mojoal"` (libmojoal.a in res/libs/vendor/<triple>,
  built by AdamLang-Libs). mojoAL starts SDL's audio itself at
  alcOpenDevice, so the unit links libsdl3.a; set SDL_HINT_AUDIO_DRIVER
  (System.SDL3.C) before it to pick a driver ("dummy": no sound device).
  Do not edit: a change belongs in the spec,
  res/cimport/System.MojoAL.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# mojoAL plays through SDL3's audio
[[insert]]
after = "module unit System.MojoAL.C;\n"
text = """

@linklibrary "sdl3";
"""
