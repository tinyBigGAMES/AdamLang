  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.Json.C.adam - the C API of yyjson (YaoYuan, ibireme/yyjson
  0.13.0, MIT), written by `adam cimport` from the yyjson.h libyyjson.a is
  built with (res/libs/vendor/include/yyjson) with the header's own names:
  its types as records laid out as C lays them out, its routines `external
  "yyjson"` (libyyjson.a in res/libs/vendor/<triple>, built by
  AdamLang-Libs), its inline routines (the value / document readers and
  writers) translated into Adam routines; the C string routines they call
  are System.LibC.C's. Left out (the spec's [skip]): the macros that are
  C-compiler words (attributes, a feature test, a hint, a cast taking a
  type) and the foreach / add_func statement macros. System.Json is the
  Adam API over it. Do not edit: a change belongs in the spec,
  res/cimport/System.Json.C.cimport.toml, then regenerate.
*******************************************************************************/

'''
