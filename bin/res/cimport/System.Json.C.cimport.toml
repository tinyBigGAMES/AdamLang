# System.Json.C: yyjson's C API, written by `adam cimport` from the installed yyjson.h
# (res/libs/vendor/include/yyjson, AdamLang-Libs build-yyjson.cmd); System.Json is the Adam
# API over it. Regenerate: adam cimport res\cimport\System.Json.C.cimport.toml
format = 1

[import]
header = "yyjson.h"
unit = "System.Json.C"
library = "yyjson"
output = "../libs/std"

[preprocess]
includes = ["../libs/vendor/include/yyjson"]
# libc.a's headers, a C library's own (system headers), before the platform's: yyjson's
# string.h and math.h are the ones its routines bind (System.LibC.C), its stdio.h / stdlib.h
# the platform C runtime's
systemincludes = ["../libs/vendor/include/c"]

[uses]
"System.LibC.C" = ["math.h", "string.h", "strings.h", "features.h"]

[skip]
# macros that are C-compiler words, not values (each read): the header's feature tests
# (__has_include / _builtin / _attribute / _feature of a parameter), its storage / attribute spellings, an optimizer hint, a cast taking a type
# (its uses in the inline routines are translated); and the statement macros, a loop or an if
# head the caller's own statement completes (System.Json gives `for .. in` instead)
macros = ["yyjson_has_include", "yyjson_has_builtin", "yyjson_has_attribute",
  "yyjson_has_feature", "yyjson_inline", "yyjson_noinline", "yyjson_align",
  "yyjson_deprecated", "yyjson_api_inline", "yyjson_assume", "yyjson_constcast",
  "yyjson_arr_foreach", "yyjson_obj_foreach", "yyjson_mut_arr_foreach",
  "yyjson_mut_obj_foreach", "yyjson_mut_obj_add_func"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.Json.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
