# =============================================================================
#  howto.C.cimport.toml - every option of an Adam import spec, explained
# =============================================================================
#
#  An import spec is the TOML file `adam cimport` reads to turn a C library's
#  headers into an Adam binding unit (a `.C` unit: `external` routines and
#  variables, records laid out exactly as C lays them out, routine types, and
#  the headers' macros as typed constants and routines), all under the C
#  headers' own names.
#
#  THIS FILE IS A REFERENCE, NOT A SPEC TO RUN. It imports "Orbit", a made-up
#  orbital-mechanics C library (liborbit), so that one file can show every
#  option at once. Its headers and folders do not exist, so running it stops
#  at the first folder it cannot find (CP0009). Copy it, keep the parts your
#  library needs, point the paths at real folders, and rename the copy to
#  <your unit name>.cimport.toml. The real, working specs in this folder
#  (System.Zlib.C, System.SDL3.C, System.SDL3_mixer.C ...) are short examples
#  of the same options.
#
#  The command line:
#
#    adam cimport <spec> [-o <folder>] [-t <target>] [--quiet]
#                        [--emit-pp] [--emit-unit] [--emit-layout]
#
#      -o <folder>     write the unit there (wins over [import] output)
#      -t <target>     the target triple or name to import for (adam help
#                      lists them); default: the default target
#      --quiet         print only the reports
#      --emit-pp       print the preprocessed headers (clang -E's text) and
#                      stop: the first thing to look at when a declaration
#                      comes out wrong
#      --emit-unit     also print the unit that was written
#      --emit-layout   also print the layout probe (see layoutprobe below)
#
#  The rules the spec is checked by:
#    - A key or table the importer does not know is an error at its line
#      (CP0004), never ignored: a misspelt key would change the unit in
#      silence.
#    - Every folder is relative to THIS FILE's folder; one read from must
#      exist (CP0009), the output folder is made when missing.
#    - A C name (in [skip], [renames], defines) is a C identifier; an Adam
#      name is an identifier that is no Adam keyword (CP0010 / CP0011).
#    - Every report points at the spec's (or the header's) file, line and
#      column. What the importer cannot bind is never dropped silently: it is
#      a CI0001 warning naming the declaration and the reason.
#    - The written unit says "do not edit": every change belongs in its
#      spec, then the unit is regenerated. A spec is how a binding is kept.
#
# =============================================================================

# -----------------------------------------------------------------------------
#  format  (REQUIRED)
# -----------------------------------------------------------------------------
# The spec's format number. Adam reads format 1; a newer number is CP0005, so
# an old adam never misreads a spec written for a newer one.
format = 1


# =============================================================================
#  [import] - what is read and what is written
# =============================================================================
[import]

# header  (REQUIRED)
# The header(s) to import, each looked up exactly as `#include <...>` finds
# it: first the [preprocess] includes folders below, then its systemincludes,
# then the system headers Adam ships (res/libs/system/include/clang, then
# .../include/<triple>).
# One header is a string:
#     header = "orbit/orbit.h"
# Several are an array; they are read in this order, as if one C file
# included them one after the other:
header = ["orbit/orbit.h", "orbit/orbit_math.h", "orbit/orbit_events.h"]

# unit  (REQUIRED)
# The Adam unit written: <unit>.adam. Dotted identifiers, no segment an Adam
# keyword (CP0006). End it in `.C` by convention: a `.C` unit is the raw C
# API with C's names; an Adam-style API unit can then be written over it
# (as System.Zlib is over System.Zlib.C).
unit = "Acme.Orbit.C"

# library
# The library every routine and variable is `external` in. One name for
# every target:
#     library = "orbit"
# or one name per target triple, as an inline table (a key must be a triple
# Adam knows, CP0008; a target with no entry gets plain `external`):
library = { "x86_64-windows-gnu" = "orbit" }
#     library = { "x86_64-windows-gnu" = "orbit", "x86_64-linux-gnu" = "orbit" }
#     (the second entry once Adam has the linux64 target)
# A bare name is found the way @linklibrary finds one: in each library path,
# the first of liborbit.dll.a, orbit.dll.a, liborbit.a, orbit.lib,
# liborbit.dll, orbit.dll.

# linkage
# How the routines reach the library:
#   "static"  (the default) the bare name above: `external "orbit"`, linked
#             in from the static library (or an import library) found by
#             the search above
#   "dll"     the name with the target's dll extension: `external
#             "orbit.dll"`, every routine and variable imported from that
#             DLL at load time, no .a or .lib needed (a name that already
#             ends in .dll is kept as written)
linkage = "dll"

# output
# The folder <unit>.adam is written into, made when missing; default: this
# spec's folder. `adam cimport -o <folder>` wins over it.
output = "../acme/units"

# sources
# The folders whose declarations are BOUND (written into the unit). Every
# other header the imported ones include (the C runtime, windows.h, a
# library's private headers in another folder) is still read, so its types
# and macros are known, but nothing of it is written. Default: each [import]
# header's own folder. Here the public headers live in two folders:
sources = ["../vendor/orbit/include/orbit", "../vendor/orbit/include/orbit/ext"]
# A declaration that needs a type from an unbound header which no [uses]
# unit owns: a pointer to it is written as untyped `ptr`; anything holding
# it by value is CI0001 (not bound, with the reason).

# layoutprobe
# true: also write <unit>.layout.c beside the unit: a C file of
# _Static_asserts (sizeof, _Alignof and offsetof of every record and every
# field, as ADAM laid them out). Compile it with the same C compiler and
# flags the library was built with (zig cc / clang): it compiles only if
# Adam's layouts equal C's. A development-side proof, never part of a build.
# Default false. (--emit-layout prints the same text.)
layoutprobe = true


# =============================================================================
#  [preprocess] - how the headers are preprocessed (as clang would)
# =============================================================================
# The importer has its own C preprocessor, which sees what clang saw when the
# library was built, with clang's predefined macros for the target. Pass it
# the same -D / -U / -I the library was built with, or the unit will not
# match the library.
[preprocess]

# defines: as clang -D. "NAME" alone means NAME=1; "NAME=value" any text.
defines = [
  "ORBIT_STATIC_ASSERTS",            # = 1
  "ORBIT_FLOAT=double",              # the type the library was built with
  "ORBIT_API=",                      # an empty export macro
  "ORBIT_MAX_BODIES=256",
]

# undefines: as clang -U (also removes a predefined macro).
undefines = ["ORBIT_DEBUG", "_DEBUG"]

# includes: folders searched for headers, in order, before the system ones.
includes = [
  "../vendor/orbit/include",         # holds orbit/orbit.h
  "../vendor/acme_physics/include",  # orbit.h includes <physics/body.h>
  "../libs/vendor/include/sdl3",     # orbit_events.h includes <SDL3/SDL.h>
]

# systemincludes: folders searched after includes and before the system ones, their headers
# system headers (clang -isystem: no warning from them, their declarations bound only when
# [uses] names a unit for them): a C library's own, such as libc.a's musl headers, which
# orbit.h's <string.h> should be (System.LibC.C owns their routines, see [uses]).
systemincludes = ["../libs/vendor/include/c"]


# =============================================================================
#  [uses] - declarations another unit already owns
# =============================================================================
# When the headers include another library's headers (Orbit's events come
# from SDL3, its bodies from Acme's physics library), those declarations
# must not be written a second time: a second copy of SDL_Event would be a
# different type from System.SDL3.C's.
#
#   "<unit>" = ["header glob", ...]
#
# Every declaration from a header matching a glob is that unit's: the written
# unit imports the unit and uses its names, writing none of them again. A
# glob is matched against the header's path as it was included (relative to
# its include folder), case-sensitive: '*' is any run of characters, '/'
# included; '?' is any one character.
[uses]
"System.SDL3.C"     = ["SDL3/*"]
"Acme.Physics.C"    = ["physics/body.h", "physics/shape_*.h"]
"System.LibC.C"     = ["string.h", "strings.h", "math.h", "features.h"]


# =============================================================================
#  [skip] - C names left out of the unit
# =============================================================================
# Globs ('*' any run of characters, '?' any one) over C names. A skipped name
# is not written; a declaration that needs it cannot be bound either.
# Use it for what Adam must not bind: private helpers, deprecated aliases,
# declarations a program supplies itself, macros that only make sense to a
# C compiler.
[skip]
# typedefs, struct / union / enum tags
types = ["orbit_internal_*", "orbit_legacy_body_t"]
# routines and variables
routines = ["orbit__*", "orbit_debug_dump", "orbit_set_allocator_v1"]
# macros (object-like and function-like)
macros = ["ORBIT_DEPRECATED", "ORBIT_UNUSED", "ORBIT_INLINE", "ORBIT_*_H_"]


# =============================================================================
#  [renames] - an Adam name for a C name
# =============================================================================
#   "<C name>" = "<Adam name>"
#
# Any file-scope C name: a typedef, a struct / union / enum tag, an enum
# value, a routine, a variable, a macro. The unit declares it under the Adam
# name (an `external` routine still binds the C symbol: the unit writes
# `external "orbit.dll" name "orb_free"` for it). Use it for a clash or a
# name that cannot be used; never to restyle a C API (a `.C` unit keeps C's
# names; a nicer API goes in a unit over it).
#
# A C name that is an Adam keyword needs NO rename: it gets a trailing '_'
# by itself (a C routine `begin` becomes `begin_`, a field `type` `type_`).
# A rename's Adam name may not be a keyword (CP0011).
[renames]
"orb_free"           = "orbit_free"             # the clearer name the docs use
"orbit_Body"         = "orbit_body_rec"         # clashes with orbit_body (a routine)
"ORBIT_VERSION"      = "ORBIT_VERSION_NUMBER"   # clashes with orbit_version()


# =============================================================================
#  [[insert]] - text put into the written unit
# =============================================================================
# Each [[insert]] table (an array of tables: write [[insert]] once per edit)
# changes the unit's text after it is written, in order, before it is saved:
#
#   exactly one anchor (CP0012):
#     before  = "text"   put `text` just before the anchor
#     after   = "text"   put `text` just after it
#     replace = "text"   put `text` in its place
#   text       = "..."   (REQUIRED) what goes there
#   occurrence = N       which match of the anchor (1 = the first, the
#                        default; below 1 is CP0013)
#
# The anchor is matched byte for byte against the written unit, whose lines
# end in "\n". An anchor that is not there is an error (CI0002) and nothing
# is written: a header change that moves the text is caught, never applied
# somewhere else. Use TOML's ''' ... ''' (literal, no escapes) for text
# with backslashes or quotes, """ ... """ when you need "\n" escapes.

# 1. A file header above the unit's first line. The unit always begins
#    "// <unit>.adam - written by adam cimport for <triple>".
[[insert]]
before = "// Acme.Orbit.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
  Acme.Orbit.C.adam - Orbit's C API (Acme Space Works, zlib license),
  written by adam cimport from orbit.h / orbit_math.h / orbit_events.h.
  Do not edit: a change belongs in its spec, howto.C.cimport.toml.
*******************************************************************************/

'''

# 2. A directive right after the module line: Orbit calls Acme's physics
#    library, so a program using this unit links that one too.
[[insert]]
after = "module unit Acme.Orbit.C;\n"
text = """

@linklibrary "acme_physics";
"""

# 3. A replacement at the SECOND match: C left the user-data parameter of
#    the second routine taking one unnamed, so the unit calls it p2; give
#    it the name the library's documentation uses.
[[insert]]
replace = "p2: ptr)"
occurrence = 2
text = "user_data: ptr)"


# =============================================================================
#  What the importer does with the headers (no key needed)
# =============================================================================
#  - Routines and variables: `external` declarations with C linkage
#    (`clink`), parameters by C's rules, `...` kept; an `asm("name")` label
#    becomes `name "sym"`.
#  - Records: structs as records, unions as overlays, bitfields, anonymous
#    members, flexible array members (`d: array[0..] of T`), #pragma pack and
#    __attribute__((packed / aligned)) as `packed(N)` / `align(N)`, laid out by
#    the target's own C rules (prove it with layoutprobe).
#  - Enums as C has them, plain integers: the enum type an alias of its
#    underlying type (`color = int32;`), each value a typed constant
#    (`RED: int32 = 0;`). Function pointer typedefs as routine types.
#  - Object-like macros as typed constants, evaluated by C's constant-
#    expression rules (ints, floats, strings, sizeof, casts).
#  - Function-like macros as Adam routines where they can be: typed by the
#    routines they call, generic routines (T) where no type fixes them.
#  - `static inline` C functions translated into Adam routines.
#  - Anything Adam cannot express: CI0001, by name, with the reason. Look at
#    the reports after every import: each one is a declaration the unit
#    does not have.
