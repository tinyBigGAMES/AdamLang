  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.XML.C.adam - the C API of libxml2 (GNOME, v2.15.4, MIT: XML 1.0 +
  namespaces, SAX2, DTD, XPath, XPointer, XInclude, XML Schema, RelaxNG,
  Schematron, C14N, xmlreader / xmlwriter, HTML, catalogs), written by
  `adam cimport` from the headers libxml2.a is built with
  (res/libs/vendor/include/xml2, each target's xmlversion.h first) with
  the headers' own names: its types as records laid out as C lays them out,
  its routines `external "xml2"` (libxml2.a in res/libs/vendor/<triple>,
  built by AdamLang-Libs, LIBXML_STATIC). libxml2 reads gzip'd XML through
  zlib and, on x86_64-windows-gnu, seeds its hashes through bcrypt: the
  unit names both with @linklibrary. Left out (the spec's [skip]): the
  macros that are C-compiler words (the export spellings, the attributes),
  the XPath extension statement macros (CHECK_*, XP_ERROR*, CAST_TO_*: their
  routines are here), BAD_CAST (a string converts itself), the field-name
  spellings xmlChildrenNode / xmlRootNode, and the (*__xmlX()) global
  places, reached through their __xmlX() routines (__xmlLastError() ..).
  System.XML is the Adam API over it. Do not edit: a change belongs in the
  spec, res/cimport/System.XML.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# libxml2 calls zlib (gz* reads) and, on x86_64-windows-gnu, bcrypt's BCryptGenRandom
[[insert]]
after = "module unit System.XML.C;\n"
text = """

@linklibrary "zlib";
@ifdef TARGET_X86_64_WINDOWS_GNU
  @linklibrary "bcrypt";
@endif
"""
