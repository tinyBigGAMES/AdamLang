# System.XML.C: libxml2's C API, written by `adam cimport` from the installed libxml2 headers
# (res/libs/vendor/include/xml2, AdamLang-Libs build-libxml2.cmd); System.XML is the Adam API
# over it. Regenerate: adam cimport res\cimport\System.XML.C.cimport.toml
format = 1

[import]
# every public header libxml2 installs (its xmlexports.h / xmlversion.h come in through them)
# but the four that declare nothing in this build: nanohttp.h / nanoftp.h (empty without
# LIBXML_HTTP_STUBS_ENABLED), SAX.h (empty without LIBXML_LEGACY_ENABLED) and xmlunicode.h
# (2.15 left only its "deprecated" #warning)
header = [
  "libxml/parser.h",
  "libxml/tree.h",
  "libxml/SAX2.h",
  "libxml/parserInternals.h",
  "libxml/entities.h",
  "libxml/dict.h",
  "libxml/hash.h",
  "libxml/list.h",
  "libxml/chvalid.h",
  "libxml/xmlstring.h",
  "libxml/encoding.h",
  "libxml/xmlIO.h",
  "libxml/xmlerror.h",
  "libxml/xmlmemory.h",
  "libxml/globals.h",
  "libxml/threads.h",
  "libxml/uri.h",
  "libxml/valid.h",
  "libxml/xmlregexp.h",
  "libxml/xmlautomata.h",
  "libxml/pattern.h",
  "libxml/xpath.h",
  "libxml/xpathInternals.h",
  "libxml/xpointer.h",
  "libxml/xlink.h",
  "libxml/xinclude.h",
  "libxml/catalog.h",
  "libxml/c14n.h",
  "libxml/xmlsave.h",
  "libxml/xmlreader.h",
  "libxml/xmlwriter.h",
  "libxml/xmlschemas.h",
  "libxml/xmlschemastypes.h",
  "libxml/schemasInternals.h",
  "libxml/relaxng.h",
  "libxml/schematron.h",
  "libxml/HTMLparser.h",
  "libxml/HTMLtree.h",
  "libxml/debugXML.h",
  "libxml/xmlmodule.h"]
unit = "System.XML.C"
library = "xml2"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
# the static library's headers: without LIBXML_STATIC xmlexports.h declares the API dllimport
defines = ["LIBXML_STATIC"]
# each target's generated xmlversion.h (LIBXML_MODULE_EXTENSION) before the shared headers
includes = { "x86_64-windows-gnu" = ["../libs/vendor/include/xml2/x86_64-windows-gnu", "../libs/vendor/include/xml2"], "x86_64-linux-gnu" = ["../libs/vendor/include/xml2/x86_64-linux-gnu", "../libs/vendor/include/xml2"] }

[skip]
# macros that are C-compiler words, not values (each read): the export / calling-convention
# spellings and the attributes (alloc_size, format, deprecated)
macros = ["XMLPUBFUN", "XMLPUBVAR", "XMLCALL", "XMLCDECL", "LIBXML_ATTR_ALLOC_SIZE",
  "LIBXML_ATTR_FORMAT", "XML_DEPRECATED", "XML_DEPRECATED_MEMBER", "LIBXML_DLL_IMPORT",
  # statements for C code inside an XPath extension function (if .. return, a goto-like
  # early exit): no value; their routines are bound (xmlXPathErr, xmlXPathCastToString ..)
  "CHECK_ERROR", "CHECK_ERROR0", "XP_ERROR", "XP_ERROR0", "CHECK_TYPE", "CHECK_TYPE0",
  "CHECK_ARITY", "CAST_TO_STRING", "CAST_TO_NUMBER", "CAST_TO_BOOLEAN",
  "xmlXPathSetError", "xmlXPathSetArityError", "xmlXPathSetTypeError", "xmlXPathEmptyNodeSet",
  # a cast word for C string literals: Adam's string converts to ptr to const xmlChar itself
  "BAD_CAST",
  # C field-name spellings (n->xmlChildrenNode is n->children): no Adam form, the field is
  "xmlChildrenNode", "xmlRootNode",
  # the per-thread globals as (*__xmlX()) places: their __xmlX() routines are bound
  "xmlLastError", "xmlGenericError", "xmlGenericErrorContext", "xmlStructuredError",
  "xmlStructuredErrorContext", "xmlDoValidityCheckingDefaultValue", "xmlGetWarningsDefaultValue",
  "xmlKeepBlanksDefaultValue", "xmlLineNumbersDefaultValue", "xmlLoadExtDtdDefaultValue",
  "xmlPedanticParserDefaultValue", "xmlSubstituteEntitiesDefaultValue", "xmlIndentTreeOutput",
  "xmlTreeIndentString", "xmlSaveNoEmptyTags", "xmlRegisterNodeDefaultValue",
  "xmlDeregisterNodeDefaultValue", "xmlParserInputBufferCreateFilenameValue",
  "xmlOutputBufferCreateFilenameValue"]

# function-like macros whose use alone cannot type a parameter (its fields are in several
# structs): the C type each parameter has
[macro_params]
"xmlXPathNodeSetGetLength" = { ns = "xmlNodeSetPtr" }
"xmlXPathNodeSetItem" = { ns = "xmlNodeSetPtr", index = "int" }
"xmlXPathNodeSetIsEmpty" = { ns = "xmlNodeSetPtr" }
"xmlXPathGetError" = { ctxt = "xmlXPathParserContextPtr" }
"xmlXPathCheckError" = { ctxt = "xmlXPathParserContextPtr" }
"xmlXPathGetDocument" = { ctxt = "xmlXPathParserContextPtr" }
"xmlXPathGetContextNode" = { ctxt = "xmlXPathParserContextPtr" }
"xmlXPathStackIsNodeSet" = { ctxt = "xmlXPathParserContextPtr" }
"xmlXPathStackIsExternal" = { ctxt = "xmlXPathParserContextPtr" }
"XML_GET_CONTENT" = { n = "xmlNodePtr" }
"htmlElementAllowedHereDesc" = { elt = "const htmlElemDesc *" }
"initGenericErrorDefaultFunc" = { h = "xmlGenericErrorFunc *" }

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.XML.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
