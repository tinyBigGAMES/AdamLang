# System.Raylib.C: raylib's C API (raylib.h, raymath.h, rlgl.h), written by `adam cimport` from
# the installed raylib headers (res/libs/vendor/include/raylib, AdamLang-Libs build-raylib.cmd).
# Regenerate: adam cimport res\cimport\System.Raylib.C.cimport.toml
format = 1

[import]
header = ["raylib.h", "raymath.h", "rlgl.h"]
unit = "System.Raylib.C"
library = "raylib"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
includes = ["../libs/vendor/include/raylib"]

# raymath's inline routines call math.h (sqrtf, floorf, ..): Adam's libc.a binds those for
# both targets, so math.h's declarations are System.LibC.C's
[uses]
"System.LibC.C" = ["math.h", "bits/mathcalls*.h"]

# C forms with no Adam one (each read): raymath's RMAPI (the inline / export keyword its
# routines are declared with), rlgl's TRACELOG (a variadic macro, (void)0 unless rlgl is
# compiled with it) and its RL_MALLOC / RL_CALLOC / RL_REALLOC / RL_FREE (rlgl's own
# allocation hooks over stdlib.h, for its implementation; a program allocates through Adam)
[skip]
macros = ["RMAPI", "TRACELOG", "RL_MALLOC", "RL_CALLOC", "RL_REALLOC", "RL_FREE"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.Raylib.C.adam - written by adam cimport"
text = '''

/*******************************************************************************
  Adam™ Programming Language

  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.Raylib.C.adam - raylib's C API (Ramon Santamaria, zlib license,
  6.2: windows, input, 2D / 3D drawing, textures, fonts, models, audio),
  written by `adam cimport` from the headers libraylib.a is built with
  (res/libs/vendor/include/raylib: raylib.h, raymath.h, rlgl.h) with their
  own names: every routine `external "raylib"` (libraylib.a in
  res/libs/vendor/<triple>, built by AdamLang-Libs), records laid out as C
  lays them out, the constant macros as typed consts, raymath's inline
  routines translated into Adam. raylib's own link list (its
  LibraryConfigurations.cmake + its bundled GLFW) is the unit's
  @linklibrary list, per target: GLFW opens OpenGL's library at run time on
  linux, so only libX11 (six routines raylib's objects name) is linked
  there. Do not edit: a change belongs in the spec,
  res/cimport/System.Raylib.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# raylib's own link list, per target: what libraylib.a's objects import
[[insert]]
after = "module unit System.Raylib.C;\n"
text = """

@ifdef TARGET_X86_64_WINDOWS_GNU
  @linklibrary "kernel32";
  @linklibrary "user32";
  @linklibrary "gdi32";
  @linklibrary "shell32";
  @linklibrary "opengl32";
  @linklibrary "winmm";
@elseif TARGET_X86_64_LINUX_GNU
  @linklibrary "X11";
  @linklibrary "m";
  @linklibrary "pthread";
  @linklibrary "dl";
@endif
"""
