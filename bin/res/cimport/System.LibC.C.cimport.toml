# System.LibC.C: libc.a's pure C routines, written by `adam cimport` from the installed math.h
# and string.h (res/libs/vendor/include/c, AdamLang-Libs build-c.cmd: musl's). Regenerate:
# adam cimport res\cimport\System.LibC.C.cimport.toml
format = 1

[import]
header = ["math.h", "string.h"]
unit = "System.LibC.C"
library = "c"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
# the whole of math.h and string.h as libc.a's sources build them (musl's _GNU_SOURCE: the
# X/Open and BSD parts too)
defines = ["_GNU_SOURCE"]
includes = ["../libs/vendor/include/c"]

[skip]
# the locale is the platform C runtime's: its type is used only by the _l routines left out
types = ["locale_t", "__locale_struct"]
# long double has no Adam type; musl's classification helpers are a build detail (libc.a
# renames them on win64, where mingw-w64 owns those names)
routines = ["__*",
  "acoshl", "acosl", "asinhl", "asinl", "atan2l", "atanhl", "atanl", "cbrtl", "ceill",
  "copysignl", "coshl", "cosl", "erfcl", "erfl", "exp2l", "expl", "expm1l", "fabsl", "fdiml",
  "floorl", "fmal", "fmaxl", "fminl", "fmodl", "frexpl", "hypotl", "ilogbl", "ldexpl",
  "lgammal", "llrintl", "llroundl", "log10l", "log1pl", "log2l", "logbl", "logl", "lrintl",
  "lroundl", "modfl", "nanl", "nearbyintl", "nextafterl", "nexttoward", "nexttowardf",
  "nexttowardl", "powl", "remainderl", "remquol", "rintl", "roundl", "scalblnl", "scalbnl",
  "sinhl", "sinl", "sqrtl", "tanhl", "tanl", "tgammal", "truncl", "lgammal_r", "sincosl",
  "exp10l", "pow10l",
# string.h / strings.h routines libc.a does not build (build-c.cmd's LSTRING): they allocate
# (strdup), keep state (strtok), reach the locale (strcoll, strerror, the case-blind forms)
# or are the legacy BSD names
  "strcoll", "strcoll_l", "strxfrm", "strxfrm_l", "strtok", "strerror", "strerror_l",
  "strerror_r", "strsignal", "strdup", "strndup", "strverscmp", "strcasestr", "explicit_bzero",
  "bcmp", "bcopy", "bzero", "index", "rindex", "ffs", "ffsl", "ffsll", "strcasecmp",
  "strncasecmp", "strcasecmp_l", "strncasecmp_l"]
# features.h' own and alltypes.h' words, the type-generic macros (no typed parameter) and the
# values only fpclassify gives
macros = ["__*", "fpclassify", "isfinite", "isinf", "isnan", "isnormal", "signbit",
  "isgreater", "isgreaterequal", "isless", "islessequal", "islessgreater", "isunordered",
  "HUGE_VALL", "FP_NAN", "FP_INFINITE", "FP_ZERO", "FP_SUBNORMAL", "FP_NORMAL",
# strdup on the stack (alloca: no routine); C's null pointer, Adam's nil
  "strdupa", "NULL"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.LibC.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
  Adam™ Programming Language

  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.LibC.C.adam - the pure C routines of libc.a, Adam's own C library
  (res/libs/vendor/<triple>/libc.a, built by AdamLang-Libs from upstream
  musl v1.2.6, MIT license, with the same flags for every target, so a
  routine gives the same result on win64 and linux64), written by `adam
  cimport` from the math.h and string.h it is built with
  (res/libs/vendor/include/c) with the header's own names: the math, then
  the byte-string routines that only touch the caller's memory (memcpy,
  strlen ..); ctype and the conversions join it when a job needs them. The
  OS-facing C (malloc / free, FILE stdio, errno, threads, time, exit)
  stays the platform's own C runtime and is not declared here. Left out
  (the spec's [skip]): every long double form, as Adam has no long double;
  the type-generic macros (fpclassify, isnan ..) and their helpers, musl's
  __fpclassify / __signbit (renamed on win64, where mingw-w64 owns those
  names) and FP_NAN .. FP_NORMAL with them; the string routines libc.a
  does not build (strdup, strtok, the locale's and the BSD ones) with the
  locale's type; NULL (Adam has nil). Do not edit: a change belongs in the
  spec, res/cimport/System.LibC.C.cimport.toml, then regenerate.
*******************************************************************************/

'''
