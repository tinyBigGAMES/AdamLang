# System.Minizip.C: minizip's C API, written by `adam cimport` from the installed zip.h /
# unzip.h / ioapi.h (res/libs/vendor/include/minizip, AdamLang-Libs build-minizip.cmd); zlib's
# declarations are System.Zlib.C's. Regenerate: adam cimport res\cimport\System.Minizip.C.cimport.toml
format = 1

[import]
header = ["zip.h", "unzip.h"]
unit = "System.Minizip.C"
library = "minizip"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
# z_const read as const, as System.Zlib.C does; the definitions libminizip.a is built with
defines = ["ZLIB_CONST", "_LARGEFILE64_SOURCE=1", "HAVE_UNISTD_H=1"]
includes = ["../libs/vendor/include/minizip", "../libs/vendor/include/zlib"]

[uses]
"System.Zlib.C" = ["zlib.h", "zconf.h"]

[skip]
# the copyright texts are arrays with no size (no Adam type); the Z*64 macros call through a
# file-function table's fields (a program calls its own table's)
routines = ["zip_copyright", "unz_copyright"]
macros = ["ZOPEN64", "ZREAD64", "ZWRITE64", "ZTELL64", "ZSEEK64", "ZCLOSE64", "ZERROR64"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.Minizip.C.adam - written by adam cimport"
text = '''
/*******************************************************************************
  Adam™ Programming Language

  Copyright © 2026-present tinyBigGAMES™ LLC
  All Rights Reserved.

  https://adamlang.org

  SPDX-License-Identifier: MPL-2.0 WITH AdditionRef-Adam-Runtime-Exception

  This Source Code Form is subject to the terms of the
  Mozilla Public License, v. 2.0. If a copy of the MPL
  was not distributed with this file, You can obtain one
  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.Minizip.C.adam - minizip's C API (Gilles Vollant, zlib license;
  zlib's contrib/minizip at tag v1.4), written by `adam cimport` from the
  ioapi.h / zip.h / unzip.h libminizip.a is built with
  (res/libs/vendor/include/minizip) with the headers' own names: the
  file-function tables, the zip writer's and the unzip reader's records
  laid out as C lays them out, every routine `external "minizip"`
  (libminizip.a in res/libs/vendor/<triple>, built by AdamLang-Libs). The
  headers include zlib.h, so zlib's declarations are System.Zlib.C's
  (imported); minizip calls zlib, so the unit names libzlib.a with
  @linklibrary. Do not edit: a change belongs in the spec,
  res/cimport/System.Minizip.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# minizip calls zlib: a program that uses it links both
[[insert]]
after = "module unit System.Minizip.C;\n"
text = '''

@linklibrary "zlib";
'''
