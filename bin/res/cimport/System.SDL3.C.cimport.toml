# System.SDL3.C: SDL3's C API, written by `adam cimport` from the installed SDL3 headers
# (res/libs/vendor/include/sdl3, AdamLang-Libs build-sdl3.cmd).
# Regenerate: adam cimport res\cimport\System.SDL3.C.cimport.toml
format = 1

[import]
header = "SDL3/SDL.h"
unit = "System.SDL3.C"
library = "sdl3"
output = "../libs/std"

[preprocess]
# SDL_oldnames.h only poisons SDL2's names (each old name a macro naming its new one plus
# _renamed_): its guard keeps it out
defines = ["SDL_oldnames_h_"]
includes = ["../libs/vendor/include/sdl3"]

[skip]
# C forms with no Adam one (each read, PLAN-ADAM M9i): attribute, keyword, asm, _Static_assert
# and do { } while macros; helper macros no bound routine types (until M9k); calls into the
# system headers (memset, _beginthreadex); token pastes of a parameter; a macro over an
# inline routine of its own name (SDL_size_add / mul_check_overflow: the routine is bound)
macros = [
  "SDL_ALIGNED", "SDL_ALLOC_SIZE", "SDL_ALLOC_SIZE2", "SDL_ANALYZER_NORETURN",
  "SDL_AUDIO_BITSIZE", "SDL_AUDIO_BYTESIZE", "SDL_AUDIO_FRAMESIZE", "SDL_AUDIO_ISBIGENDIAN",
  "SDL_AUDIO_ISFLOAT", "SDL_AUDIO_ISINT", "SDL_AUDIO_ISLITTLEENDIAN", "SDL_AUDIO_ISSIGNED",
  "SDL_AUDIO_ISUNSIGNED", "SDL_AssertBreakpoint", "SDL_BITSPERPIXEL", "SDL_BUTTON_MASK",
  "SDL_BYTESPERPIXEL", "SDL_BeginThreadFunction", "SDL_COLORSPACECHROMA", "SDL_COLORSPACEMATRIX",
  "SDL_COLORSPACEPRIMARIES", "SDL_COLORSPACERANGE", "SDL_COLORSPACETRANSFER", "SDL_COLORSPACETYPE",
  "SDL_COMPILE_TIME_ASSERT", "SDL_CPUPauseInstruction", "SDL_CompilerBarrier", "SDL_CreateThread",
  "SDL_CreateThreadWithProperties", "SDL_DEFINE_AUDIO_FORMAT", "SDL_DEFINE_COLORSPACE", "SDL_DEFINE_PIXELFORMAT",
  "SDL_DEFINE_PIXELFOURCC", "SDL_DEPRECATED", "SDL_ELF_NOTE_DLOPEN", "SDL_EndThreadFunction",
  "SDL_FALLTHROUGH", "SDL_FORCE_INLINE", "SDL_FOURCC", "SDL_FUNCTION",
  "SDL_HAS_BUILTIN", "SDL_INIT_INTERFACE", "SDL_INLINE", "SDL_ISCOLORSPACE_FULL_RANGE",
  "SDL_ISCOLORSPACE_LIMITED_RANGE", "SDL_ISCOLORSPACE_MATRIX_BT2020_NCL", "SDL_ISCOLORSPACE_MATRIX_BT601", "SDL_ISCOLORSPACE_MATRIX_BT709",
  "SDL_ISPIXELFORMAT_10BIT", "SDL_ISPIXELFORMAT_ALPHA", "SDL_ISPIXELFORMAT_ARRAY", "SDL_ISPIXELFORMAT_FLOAT",
  "SDL_ISPIXELFORMAT_FOURCC", "SDL_ISPIXELFORMAT_INDEXED", "SDL_ISPIXELFORMAT_PACKED", "SDL_InvalidParamError",
  "SDL_MALLOC", "SDL_MS_TO_NS", "SDL_MUSTLOCK", "SDL_MemoryBarrierAcquire",
  "SDL_MemoryBarrierRelease", "SDL_NODISCARD", "SDL_NORETURN", "SDL_NS_TO_MS",
  "SDL_NS_TO_SECONDS", "SDL_NS_TO_US", "SDL_PIXELFLAG", "SDL_PIXELLAYOUT",
  "SDL_PIXELORDER", "SDL_PIXELTYPE", "SDL_PRINTF_VARARG_FUNC", "SDL_PRINTF_VARARG_FUNCV",
  "SDL_RESTRICT", "SDL_SCANCODE_TO_KEYCODE", "SDL_SCANF_VARARG_FUNC", "SDL_SCANF_VARARG_FUNCV",
  "SDL_SECONDS_TO_NS", "SDL_SINT64_C", "SDL_STRINGIFY_ARG", "SDL_Swap16BE",
  "SDL_Swap16LE", "SDL_Swap32BE", "SDL_Swap32LE", "SDL_Swap64BE",
  "SDL_Swap64LE", "SDL_SwapFloatBE", "SDL_SwapFloatLE", "SDL_TriggerBreakpoint",
  "SDL_UINT64_C", "SDL_UNUSED", "SDL_US_TO_NS", "SDL_VERSIONNUM",
  "SDL_VERSIONNUM_MAJOR", "SDL_VERSIONNUM_MICRO", "SDL_VERSIONNUM_MINOR", "SDL_VERSION_ATLEAST",
  "SDL_WINDOWPOS_CENTERED_DISPLAY", "SDL_WINDOWPOS_ISCENTERED", "SDL_WINDOWPOS_ISUNDEFINED", "SDL_WINDOWPOS_UNDEFINED_DISPLAY",
  "SDL_arraysize", "SDL_assert", "SDL_assert_always", "SDL_assert_paranoid",
  "SDL_assert_release", "SDL_clamp", "SDL_const_cast", "SDL_copyp",
  "SDL_disabled_assert", "SDL_enabled_assert", "SDL_max", "SDL_memcpy",
  "SDL_memmove", "SDL_memset", "SDL_min", "SDL_reinterpret_cast",
  "SDL_size_add_check_overflow", "SDL_size_mul_check_overflow", "SDL_stack_alloc", "SDL_stack_free",
  "SDL_static_cast", "SDL_zero", "SDL_zeroa", "SDL_zerop",
]

