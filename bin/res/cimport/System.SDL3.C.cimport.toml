-------------------------------------------------------------------------------
  System.SDL3.C.adam - SDL3's C API (Simple DirectMedia Layer 3, zlib
  license, release-3.4.18: windows, rendering, GPU, input, audio,
  gamepads, ...), written by `adam cimport` from the SDL3 headers libsdl3.a
  is built with (res/libs/vendor/include/sdl3) with the headers' own names:
  every routine `external "sdl3"` (libsdl3.a in res/libs/vendor/<triple>,
  built by AdamLang-Libs), records laid out as C lays them out, the
  constant macros as typed consts (a string one passes straight to C), the
  function-like macros Adam can say as routines, the inline routines
  (SDL_PointInRect, SDL_SwapFloat, ...) translated into Adam. SDL's own
  link list (its sdl3.pc, static) is the unit's @linklibrary list, per
  target. Do not edit: a change belongs in the spec,
  res/cimport/System.SDL3.C.cimport.toml, then regenerate.
*******************************************************************************/

'''

# SDL's own link list (its sdl3.pc, static), per target: what libsdl3.a's objects import
[[insert]]
after = "module unit System.SDL3.C;\n"
text = """

@ifdef TARGET_X86_64_WINDOWS_GNU
  @linklibrary "kernel32";
  @linklibrary "user32";
  @linklibrary "gdi32";
  @linklibrary "winmm";
  @linklibrary "imm32";
  @linklibrary "ole32";
  @linklibrary "oleaut32";
  @linklibrary "version";
  @linklibrary "advapi32";
  @linklibrary "setupapi";
  @linklibrary "shell32";
  @linklibrary "dinput8";
@elseif TARGET_X86_64_LINUX_GNU
  @linklibrary "m";
  @linklibrary "pthread";
  @linklibrary "dl";
  @linklibrary "rt";
@endif
"""
