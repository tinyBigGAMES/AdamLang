# System.Toml.C: tomlc17's C API, written by `adam cimport` from the installed tomlc17.h
# (res/libs/vendor/include/tomlc17, AdamLang-Libs build-tomlc17.cmd); System.Toml is the Adam
# API over it. Regenerate: adam cimport res\cimport\System.Toml.C.cimport.toml
format = 1

[import]
header = "tomlc17.h"
unit = "System.Toml.C"
library = "tomlc17"
output = "../libs/std"
# one unit for both targets: what differs stands under @ifdef TARGET_<triple>
targets = ["x86_64-windows-gnu", "x86_64-linux-gnu"]

[preprocess]
includes = ["../libs/vendor/include/tomlc17"]

[skip]
# toml_table_find is a static inline (obsolete; no library exports it); TOML_EXTERN is a word
routines = ["toml_table_find"]
macros = ["TOML_EXTERN"]

# the std file header (RULES-ADAM.md: MPL-2.0 with the Adam Runtime Exception)
[[insert]]
before = "// System.Toml.C.adam - written by adam cimport"
text = '''
