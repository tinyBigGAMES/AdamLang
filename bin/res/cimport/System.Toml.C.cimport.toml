  at https://mozilla.org/MPL/2.0/.

  This file is covered by the Adam Runtime Exception
  (RUNTIME-EXCEPTION.md).
-------------------------------------------------------------------------------
  System.Toml.C.adam - the C API of tomlc17 (CK Tan, TOML v1.0 / v1.1,
  MIT), written by `adam cimport` from the tomlc17.h libtomlc17.a is built
  with (res/libs/vendor/include/tomlc17, release R261003) with the header's
  own names: its types as records laid out as C lays them out (a member
  whose type has no name in C, the union u and its structs, is a field of
  an inline type, as in C: d.u.tab.size), its routines `external "tomlc17"`
  (libtomlc17.a in res/libs/vendor/<triple>, built by AdamLang-Libs). Every
  routine moves a datum or a result by value. System.Toml is the Adam API
  over it. Do not edit: a change belongs in the spec,
  res/cimport/System.Toml.C.cimport.toml, then regenerate.
*******************************************************************************/

'''
