# Adam project (https://adamlang.org): adamtest, Adam's test runner; its folder is $R: for
# every file of its build (src\ its own units; the compiler's units in the repo's src\, the
# std in bin\res\libs\std)
format = 1

# type: exe | dll | lib; main and output are relative to this folder
[project]
name = "adamtest"
type = "exe"
main = "src/adamtest.adam"
output = "output"
