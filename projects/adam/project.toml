# Adam project (https://adamlang.org): adam, the Adam compiler; its folder is $R: for every
# file of its build (src\adam.adam its program module; the compiler's units in the repo's
# src\, the std in bin\res\libs\std)
format = 1

# type: exe | dll | lib; main and output are relative to this folder
[project]
name = "adam"
type = "exe"
main = "src/adam.adam"
output = "output"
